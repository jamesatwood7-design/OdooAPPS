{% extends "base.html" %}
{% block title %}Record Payment{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-cash-stack"></i> Record Payment</h2>
</div>

<div class="row">
    <div class="col-md-6 mx-auto">
        <div class="card">
            <div class="card-body">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Payment Type</label>
                        <select name="payment_type" class="form-select" required>
                            <option value="inbound">Customer Payment (Receive Money)</option>
                            <option value="outbound">Vendor Payment (Send Money)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Partner <span class="text-danger">*</span></label>
                        <select name="partner_id" class="form-select" required>
                            <option value="">-- Select --</option>
                            {% for p in partners %}
                                <option value="{{ p.id }}">{{ p.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount <span class="text-danger">*</span></label>
                        <input type="number" name="amount" class="form-control" step="0.01" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Date</label>
                        <input type="date" name="payment_date" class="form-control" value="{{ today }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Bank/Cash Journal <span class="text-danger">*</span></label>
                        <select name="journal_id" class="form-select" required>
                            <option value="">-- Select --</option>
                            {% for j in journals %}
                                <option value="{{ j.id }}">{{ j.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Reference</label>
                        <input type="text" name="ref" class="form-control" placeholder="Check #, transfer ref, etc.">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-check-circle"></i> Record Payment
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
