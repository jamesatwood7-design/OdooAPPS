{% extends "base.html" %}
{% block title %}{{ title }}{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-3">
    <h2><i class="bi bi-{% if move_type == 'invoice' %}receipt{% else %}file-earmark-text{% endif %}"></i> {{ title }}</h2>
</div>

<form method="POST">
    <div class="card mb-3">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label">{% if move_type == 'invoice' %}Customer{% else %}Vendor{% endif %} <span class="text-danger">*</span></label>
                    <select name="partner_id" class="form-select" required>
                        <option value="">-- Select --</option>
                        {% for p in partners %}
                            <option value="{{ p.id }}">{{ p.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-3">
                    <label class="form-label">Date</label>
                    <input type="date" name="invoice_date" class="form-control" value="{{ today }}">
                </div>
                <div class="col-md-3">
                    <label class="form-label">Job (Analytic)</label>
                    <select name="analytic_id" class="form-select">
                        <option value="">-- None --</option>
                        {% for a in analytics %}
                            <option value="{{ a.id }}">{% if a.code %}[{{ a.code }}] {% endif %}{{ a.name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">Reference</label>
                    <input type="text" name="ref" class="form-control" placeholder="PO #, etc.">
                </div>
            </div>
        </div>
    </div>

    <div class="card mb-3">
        <div class="card-header d-flex justify-content-between">
            <h5 class="mb-0">Lines</h5>
            <button type="button" class="btn btn-sm btn-outline-success" onclick="addLine()">
                <i class="bi bi-plus"></i> Add Line
            </button>
        </div>
        <div class="card-body p-0">
            <table class="table table-sm mb-0">
                <thead class="table-light">
                    <tr>
                        <th>Description</th>
                        <th style="width:100px">Qty</th>
                        <th style="width:140px">Unit Price</th>
                        <th style="width:160px">Tax</th>
                        <th style="width:140px">Subtotal</th>
                        <th style="width:50px"></th>
                    </tr>
                </thead>
                <tbody id="linesBody">
                    <tr>
                        <td><input type="text" name="line_name_0" class="form-control form-control-sm" required></td>
                        <td><input type="number" name="line_qty_0" class="form-control form-control-sm" value="1" step="any" oninput="calcTotal()"></td>
                        <td><input type="number" name="line_price_0" class="form-control form-control-sm" step="0.01" oninput="calcTotal()"></td>
                        <td><select name="line_tax_0" class="form-select form-select-sm">
                            <option value="">No Tax</option>
                            {% for t in taxes %}<option value="{{ t.id }}">{{ t.name }} ({{ t.amount }}%)</option>{% endfor %}
                        </select></td>
                        <td class="text-end line-subtotal fw-bold">$0.00</td>
                        <td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('tr').remove();calcTotal()"><i class="bi bi-trash"></i></button></td>
                    </tr>
                </tbody>
                <tfoot>
                    <tr class="fw-bold fs-5">
                        <td colspan="4" class="text-end">Subtotal (before tax):</td>
                        <td class="text-end" id="grandTotal">$0.00</td>
                        <td></td>
                    </tr>
                </tfoot>
            </table>
        </div>
    </div>

    <div class="d-flex justify-content-end gap-2">
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-circle"></i> Create</button>
    </div>
</form>
{% endblock %}

{% block extra_scripts %}
<script>
var lineCount = 1;
var taxOptions = '<option value="">No Tax</option>';
{% for t in taxes %}taxOptions += '<option value="{{ t.id }}">{{ t.name }} ({{ t.amount }}%)</option>';{% endfor %}

function addLine() {
    var tr = document.createElement('tr');
    tr.innerHTML = '<td><input type="text" name="line_name_'+lineCount+'" class="form-control form-control-sm" required></td>' +
        '<td><input type="number" name="line_qty_'+lineCount+'" class="form-control form-control-sm" value="1" step="any" oninput="calcTotal()"></td>' +
        '<td><input type="number" name="line_price_'+lineCount+'" class="form-control form-control-sm" step="0.01" oninput="calcTotal()"></td>' +
        '<td><select name="line_tax_'+lineCount+'" class="form-select form-select-sm">'+taxOptions+'</select></td>' +
        '<td class="text-end line-subtotal fw-bold">$0.00</td>' +
        '<td><button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest(\'tr\').remove();calcTotal()"><i class="bi bi-trash"></i></button></td>';
    document.getElementById('linesBody').appendChild(tr);
    lineCount++;
}
function calcTotal() {
    var total = 0;
    document.querySelectorAll('#linesBody tr').forEach(function(tr) {
        var qty = parseFloat(tr.querySelector('[name*=qty]').value) || 0;
        var price = parseFloat(tr.querySelector('[name*=price]').value) || 0;
        var sub = qty * price;
        tr.querySelector('.line-subtotal').textContent = '$' + sub.toFixed(2);
        total += sub;
    });
    document.getElementById('grandTotal').textContent = '$' + total.toFixed(2);
}
</script>
{% endblock %}
